services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    command: postgres -c timezone=UTC -c log_timezone=UTC
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # Persist database data between container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Ensure PostgreSQL is actually ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fastapi_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TZ=UTC
      - LOG_LEVEL=${LOG_LEVEL}
      - AUTO_MIGRATE=true
    volumes:
      # Map the local directory to the container for hot-reloading
      - .:/project
    depends_on:
      db:
        # Wait for the DB healthcheck to pass before starting the API
        condition: service_healthy

volumes:
  postgres_data:
